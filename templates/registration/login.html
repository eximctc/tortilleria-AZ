{% extends 'base.html' %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<div class="card auth-card">
    <h2>Iniciar Sesión</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    {% if form.errors %}
        <p class="form-error-banner" role="alert">Usuario o contraseña incorrectos.</p>
    {% endif %}
</div>
{% endblock %}
