{% extends 'base.html' %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Crear cuenta</h2>
    <p>Regístrate para acceder al sistema.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Registrarme</button>
    </form>
    <p style="margin-top: 16px;">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>.</p>
</div>
{% endblock %}
